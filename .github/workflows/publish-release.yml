# Publishes a Lensbar release whenever a new installer is uploaded to upload/.
# Windows: upload/Lensbar-Setup.exe + upload/version.txt (e.g. 1.0.1) [+ upload/notes.md]  -> app-v<version>
# Browser: upload/ext/lensbar-*.zip + upload/ext/version.txt [+ notes.md] -> ext-v<version>
# macOS:   upload/mac/Lensbar.dmg + upload/mac/Lensbar-mac.zip + upload/mac/version.txt [+ notes.md] -> mac-v<version>
# The release is tagged app-v<version>; installed copies of Lensbar find it and update themselves.
name: Publish release
on:
  push:
    branches: [main]
    paths: ['upload/**']
  workflow_dispatch:
permissions:
  contents: write
concurrency: publish-release
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Publish the uploaded installer as a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          CHANGED=0

          # ---------- maintenance: upload/retag.txt lines "<tag> <commit>" move release tags (then the file is removed)
          if [ -f upload/retag.txt ]; then
            while read -r T C; do
              [ -n "$T" ] && git push -f origin "$C:refs/tags/$T" && echo "Moved $T to $C"
            done < upload/retag.txt
            git rm -q upload/retag.txt
            git commit -q -m "Release tags updated"
            CHANGED=1
          fi

          # ---------- macOS: upload/mac/Lensbar.dmg + Lensbar-mac.zip + version.txt -> release mac-v<version>
          # (never marked "latest", so the Windows download link keeps pointing at the Windows installer)
          if [ -f upload/mac/Lensbar-mac.zip ]; then
            MVER=$(tr -d '[:space:]' < upload/mac/version.txt)
            MTAG="mac-v$MVER"
            if [ -f upload/mac/notes.md ]; then MNOTES=$(cat upload/mac/notes.md); else MNOTES="Lensbar $MVER for macOS"; fi
            if gh release view "$MTAG" >/dev/null 2>&1; then
              gh release upload "$MTAG" upload/mac/Lensbar.dmg upload/mac/Lensbar-mac.zip --clobber
            else
              gh release create "$MTAG" upload/mac/Lensbar.dmg upload/mac/Lensbar-mac.zip --title "Lensbar $MVER for macOS" --notes "$MNOTES" --latest=false
            fi
            git rm -q upload/mac/Lensbar.dmg upload/mac/Lensbar-mac.zip
            git commit -q -m "Published $MTAG (files moved to the release)"
            CHANGED=1
          fi

          # ---------- browser extension: upload/ext/*.zip + version.txt -> release ext-v<version> (never "latest")
          if ls upload/ext/*.zip >/dev/null 2>&1; then
            EVER=$(tr -d '[:space:]' < upload/ext/version.txt)
            ETAG="ext-v$EVER"
            if [ -f upload/ext/notes.md ]; then ENOTES=$(cat upload/ext/notes.md); else ENOTES="Lensbar for browsers $EVER"; fi
            if gh release view "$ETAG" >/dev/null 2>&1; then
              gh release upload "$ETAG" upload/ext/*.zip --clobber
            else
              gh release create "$ETAG" upload/ext/*.zip --title "Lensbar for browsers $EVER" --notes "$ENOTES" --latest=false
            fi
            git rm -q upload/ext/*.zip
            git commit -q -m "Published $ETAG (files moved to the release)"
            CHANGED=1
          fi

          if [ ! -f upload/Lensbar-Setup.exe ]; then
            if [ "$CHANGED" = 1 ]; then git push; fi
            echo "No Windows installer to publish."; exit 0
          fi
          VER=$(tr -d '[:space:]' < upload/version.txt)
          TAG="app-v$VER"
          if [ -f upload/notes.md ]; then NOTES=$(cat upload/notes.md); else NOTES="Lensbar $VER"; fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "$TAG already exists - replacing its installer"
            gh release upload "$TAG" upload/Lensbar-Setup.exe --clobber
          else
            gh release create "$TAG" upload/Lensbar-Setup.exe --title "Lensbar $VER" --notes "$NOTES" --latest
          fi
          # the installer now lives on the release; take it out of the repository
          git rm -q upload/Lensbar-Setup.exe
          git commit -q -m "Published $TAG (installer moved to the release)"
          git push
      - name: Put the Mac download on the latest release too
        # so the main release page offers both downloads, and .../releases/latest/download/Lensbar.dmg always works
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          LATEST=$(gh release view --json tagName -q .tagName 2>/dev/null || true)
          MAC=$(gh release list --limit 50 --json tagName -q '[.[] | select(.tagName | startswith("mac-v"))][0].tagName' 2>/dev/null || true)
          if [ -z "$MAC" ] || [ -z "$LATEST" ] || [ "$MAC" = "$LATEST" ]; then echo "Nothing to copy."; exit 0; fi
          mkdir -p /tmp/mac
          gh release download "$MAC" -p Lensbar.dmg -D /tmp/mac --clobber
          gh release upload "$LATEST" /tmp/mac/Lensbar.dmg --clobber
          echo "Copied Lensbar.dmg from $MAC to $LATEST"
      - name: Update latest.json (what the apps check for updates)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git pull -q --rebase origin main || true
          WIN=$(gh release list --limit 50 --json tagName -q '[.[] | select(.tagName | test("^(app-)?v[0-9]"))][0].tagName')
          MAC=$(gh release list --limit 50 --json tagName -q '[.[] | select(.tagName | startswith("mac-v"))][0].tagName')
          WV=$(echo "$WIN" | sed -E 's/^(app-)?v//'); MV=${MAC#mac-v}
          printf '{\n  "windows": { "version": "%s", "tag": "%s" },\n  "mac": { "version": "%s", "tag": "%s" }\n}\n' "$WV" "$WIN" "$MV" "$MAC" > latest.json
          cat latest.json
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- latest.json; then
            git add latest.json
            git commit -q -m "latest.json: Windows $WV, Mac $MV"
            git push
          fi
